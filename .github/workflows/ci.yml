name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: zip
          - name: macos-arm64
            os: macos-14
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/astrofiler
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/astrofiler.exe target/release/astrofiler-gui.exe dist/astrofiler/
          else
            cp target/release/astrofiler target/release/astrofiler-gui dist/astrofiler/
          fi
          cp README.md LICENSE dist/astrofiler/
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a ../astrofiler-${{ matrix.name }}.zip astrofiler
          else
            tar czf ../astrofiler-${{ matrix.name }}.tar.gz astrofiler
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: astrofiler-${{ matrix.name }}
          path: astrofiler-${{ matrix.name }}.${{ matrix.archive }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: astrofiler-${{ matrix.name }}.${{ matrix.archive }}
